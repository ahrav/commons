name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Reusable so release.yml gates publish on the exact same matrix —
  # release-time and PR-time CI can never drift.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows runners validate cortexkit-paths cfg(windows) canonicalization,
  # which only compiles and runs on Windows.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  # GitHub service containers are Linux-only. Without a DSN, live PostgreSQL
  # tests skip on macOS and Windows. CORTEXKIT_REQUIRE_PG makes a missing DSN
  # fail here, preventing broken service wiring from skip-passing.
  postgres:
    name: Postgres backend (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ck
          POSTGRES_PASSWORD: ckpw
          POSTGRES_DB: ckstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck -d ckstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Test cortexkit-store-postgres (live)
        env:
          CORTEXKIT_TEST_PG_DSN: postgresql://ck:ckpw@127.0.0.1:5432/ckstore
          CORTEXKIT_REQUIRE_PG: "1"
        run: cargo test -p cortexkit-store-postgres -- --nocapture
