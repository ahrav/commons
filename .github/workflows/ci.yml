name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so release.yml gates publish on the exact same matrix —
  # release-time and PR-time CI can never drift.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows runners validate cortexkit-paths cfg(windows) canonicalization,
  # which only compiles and runs on Windows.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      # Runs only for pull requests: the gate compares the PR base and head
      # SHAs, and push/tag events lack a reliably resolvable base.
      - name: Require a push-seal version bump for represented wire changes
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        env:
          PUSH_SEAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_SEAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          output="$(cargo test --locked -p cortexkit-push-seal --test version_gate actual_git_diff_requires_version_bump -- --ignored --exact 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          # A name filter matching zero tests still exits 0. Require one passing test so a renamed test cannot silently disable the gate.
          printf '%s\n' "$output" | grep -q 'test result: ok. 1 passed' || {
            echo 'version gate test did not run; check the test name filter'
            exit 1
          }

  # GitHub service containers are Linux-only. Without a DSN, live PostgreSQL
  # tests skip on macOS and Windows. CORTEXKIT_REQUIRE_PG makes a missing DSN
  # fail here, preventing broken service wiring from skip-passing.
  postgres:
    name: Postgres backend (live)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ck
          POSTGRES_PASSWORD: ckpw
          POSTGRES_DB: ckstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ck -d ckstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Test cortexkit-store-postgres (live)
        env:
          CORTEXKIT_TEST_PG_DSN: postgresql://ck:ckpw@127.0.0.1:5432/ckstore
          CORTEXKIT_REQUIRE_PG: "1"
        run: cargo test --locked -p cortexkit-store-postgres -- --nocapture
