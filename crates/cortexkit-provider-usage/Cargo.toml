# Wire types preserve producer-supplied values; they do not enforce read-time transforms.
# Banked-reset relaxation sets `used_percent` to zero; `raw_used_percent` retains the provider value.
[package]
name = "cortexkit-provider-usage"
version = "0.6.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared wire types for the ai-provider-quota usage.get payload: ProviderUsage, Usage, RateWindow, and account/reset metadata. Pure serde, no logic."

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
