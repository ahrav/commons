[package]
name = "cortexkit-push-seal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Seals push-notification payloads with HPKE so only the recipient device can read them."

# Publishing permits registry and sibling-checkout versions to coexist in one
# binary, risking silent wire-format divergence between sealer and opener.
publish = false

[dependencies]
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
# `single_shot_seal_with_rng` and `single_shot_open` are `alloc`-gated in hpke
# 0.14, so the library builds without hpke's `getrandom` feature.
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }

[dev-dependencies]
hex = "0.4"
# `gen_keypair` sits behind hpke's `getrandom` feature. Only tests and examples
# call it.
hpke = { version = "0.14", default-features = false, features = ["getrandom"] }
serde_json = "1"
semver = "1"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
