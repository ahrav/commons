[package]
name = "cortexkit-push-seal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Seals push-notification payloads with HPKE so only the recipient device can read them."

# Publishing permits registry and sibling-checkout versions to coexist in one
# binary, risking silent wire-format divergence between sealer and opener.
publish = false

[dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["sys_rng"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
